session_name: edgeAI
start_directory: ~/Uni/edgeAI/edgeai_robot_ws
shell_command_before:
  - eval "$(pixi shell-hook)" && source install/setup.bash
windows:
  - window_name: sim
    panes: [./start_sim.sh]
  - window_name: nav2
    panes: ["sleep 10 && ros2 launch edgeai_rescue navigation.launch.py rviz:=true"]
  - window_name: robot_control
    panes: ["sleep 15 && ros2 launch edgeai_rescue robot_controller.launch.py"]
  - window_name: coordinator
    panes: ["sleep 20 && ros2 launch edgeai_rescue rescue_coordinator.launch.py"]  # scenario: EDGEAI_SCENARIO (default midterm)
  - window_name: shell
    layout: even-vertical
    panes:
      - echo 'start the run with - ros2 service call /start_rescue std_srvs/srv/Empty'
      - echo 'summarize the last run with - ros2 run edgeai_rescue summarize_run'